<!DOCTYPE html>
<html lang="en"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KGSF Seoul Buyer Guide</title>
<style>
:root{--ink:#142e46;--teal:#087f81;--bg:#f2f5f7;--line:#dce5eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}header{background:var(--ink);color:white;padding:42px max(22px,calc((100vw - 1000px)/2)) 36px}header small{letter-spacing:3px;color:#81d9cf}h1{font-size:clamp(30px,6vw,48px);line-height:1.15;margin:16px 0}header p{color:#cedce6}.tag{display:inline-block;font-size:12px;border-radius:20px;background:#e8f5f2;color:#086b62;padding:4px 10px}.pending{background:#fff2d6;color:#795400}nav{position:sticky;top:0;z-index:1;background:white;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:10px max(14px,calc((100vw - 1000px)/2));gap:7px}button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#eaf0f4;color:var(--ink);white-space:nowrap}button[aria-selected=true],.primary{background:var(--teal);color:white}button:focus-visible,input:focus-visible{outline:3px solid #e1ae39;outline-offset:3px}button:disabled{opacity:.6}main{max-width:1044px;margin:auto;padding:26px 22px 60px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 4px 16px #142e4605}.card h3{margin:8px 0 12px;font-size:20px}.body{white-space:pre-line}.muted{color:#5b6e7e;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid button{text-align:left;white-space:normal;padding:22px;background:white;border:1px solid var(--line)}input{font:inherit;border:1px solid #a8bcc9;border-radius:8px;padding:11px;max-width:100%;width:320px}form{display:flex;gap:10px;flex-wrap:wrap}.error{color:#a02b20}footer{font-size:12px;color:#627483;margin-top:28px}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:90px}th{background:#eef5f7}@media(max-width:550px){.card{padding:18px}.grid{grid-template-columns:1fr}header{padding-top:28px}h2{font-size:23px}}@media print{nav,form,.grid,header small{display:none}.card{break-inside:avoid;box-shadow:none}header{background:white;color:#142e46;padding:10px}header p{color:#142e46}}
</style></head><body>
<header><small>KITA · BUYER SERVICES</small><h1>Your Seoul<br>business journey.</h1><p>Korea Grand Sourcing Fair 2026<br>November 23–26 · Seoul, Korea</p><span class="tag pending" id="mode">WORKING DRAFT</span></header>
<nav id="nav" aria-label="Guide sections"></nav><main><div id="notice" role="status" aria-live="polite">Loading guide…</div><section id="view"></section><footer>All times KST (UTC+9). Program details are subject to confirmation.<br><span id="updated"></span></footer></main>
<script>
const tabs=[['welcome','Overview'],['schedule','Program'],['meetings','My meetings'],['airport','Airport'],['hotel','Hotel'],['shuttle','Shuttle'],['venue','Venue'],['notices','Notices'],['contacts','Contacts']];
let data=null,active='welcome',requestVersion=0;
const el=id=>document.getElementById(id);
function node(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function pill(status){return node('span',({PENDING:'To be confirmed',PLANNED:'Planned',CONFIRMED:'Confirmed',SAMPLE:'Sample only',CANCELLED:'Cancelled'})[status]||status,'tag '+(status==='CONFIRMED'?'':'pending'))}
function card(title,body,status){const c=node('article',undefined,'card');if(status)c.append(pill(status));c.append(node('h3',title),node('div',body,'body'));return c}
function show(key){active=key;requestVersion++;el('view').replaceChildren();document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.key===key)));const title=tabs.find(t=>t[0]===key)[1];el('view').append(node('h2',title));if(!data)return;
if(key==='meetings'){meetingForm();return}
if(key==='schedule'){data.schedule.forEach(r=>el('view').append(card(r.date+' · '+r.title,r.detail,r.status)));return}
data.guide.filter(r=>r.section===key).forEach(r=>{const c=card(r.title,r.body,r.status);if(r.updated_at)c.append(node('p','Updated: '+r.updated_at,'muted'));el('view').append(c)});
if(key==='welcome'){const g=node('div',undefined,'grid');[['meetings','View my meeting schedule'],['airport','Find airport arrival information'],['shuttle','Check hotel–venue transfers'],['contacts','Contact buyer support']].forEach(([k,t])=>{const b=node('button',t);b.onclick=()=>show(k);g.append(b)});el('view').append(g)}
if(key==='contacts'){const p=node('p');const a=node('a','Email KITA');a.href='mailto:justin0830@kita.net';const b=node('a','Call KITA office');b.href='tel:+82260004440';p.append(a,document.createTextNode(' · '),b);el('view').append(p)}}
function meetingForm(){el('view').append(node('p','Stay at your assigned buyer booth with your interpreter. Matched suppliers will visit you according to your schedule.'));const c=node('div',undefined,'card'),f=node('form'),label=node('label','Buyer access code');label.htmlFor='code';const input=node('input');input.id='code';input.required=true;input.maxLength=80;input.autocomplete='off';input.placeholder='Enter your private access code';const button=node('button','View schedule','primary');button.type='submit';const result=node('div');result.setAttribute('aria-live','polite');c.append(label);f.append(input,button);c.append(f,result);el('view').append(c);if(!window.google?.script?.run)c.append(node('p','Offline demo code: DEMO-SEOUL-2026 · All meetings are fictional.','muted'));
f.onsubmit=e=>{e.preventDefault();result.replaceChildren(node('p','Loading…'));button.disabled=true;const version=++requestVersion;const done=rows=>{if(version!==requestVersion)return;button.disabled=false;result.replaceChildren();const wrap=node('div',undefined,'scroll'),table=node('table'),head=node('thead'),tr=node('tr');['Date','Time','Supplier','Products','Buyer booth','Status'].forEach(t=>tr.append(node('th',t)));head.append(tr);table.append(head);const body=node('tbody');rows.forEach(r=>{const line=node('tr');['date','time','supplier','products','booth'].forEach(k=>line.append(node('td',r[k])));const td=node('td');td.append(pill(r.status));line.append(td);body.append(line)});table.append(body);wrap.append(table);result.append(wrap)};const fail=err=>{if(version!==requestVersion)return;button.disabled=false;result.replaceChildren(node('p',err.message||'Unable to load. Please try again.','error'))};if(window.google?.script?.run)google.script.run.withSuccessHandler(done).withFailureHandler(fail).getMyMeetings(input.value);else setTimeout(()=>input.value.trim()==='DEMO-SEOUL-2026'?done(DEMO_MEETINGS):fail({message:'No published meetings found. Please check your code.'}),200)}}
function loaded(d){data=d;el('notice').textContent='Working draft · Items marked “To be confirmed” are not finalized.';el('updated').textContent='Data loaded: '+d.fetchedAt+' KST';show(active)}
tabs.forEach(([key,label])=>{const b=node('button',label);b.dataset.key=key;b.setAttribute('aria-selected','false');b.onclick=()=>show(key);el('nav').append(b)});
/* Local preview data inserted during packaging. Apps Script ignores this block's demo path. */
const DEMO_DATA={"guide":[{"section":"welcome","title":"Welcome to KGSF 2026","body":"Seoul Program | November 23–26, 2026\nBusiness meetings: November 24–25 | COEX, Seoul\nAll times: Korea Standard Time (UTC+9).","status":"PLANNED","updated_at":"2026-10-28"},{"section":"welcome","title":"How your meetings work","body":"This is a pre-arranged B2B matching event. Review supplier products and select companies you would like to meet before the event. During the event, stay at your assigned buyer booth with your interpreter. Matched suppliers will visit your booth according to your schedule. Approximately nine meetings per day are planned.","status":"PLANNED","updated_at":"2026-10-28"},{"section":"airport","title":"Airport arrival · November 23","body":"Incheon International Airport · Terminal 1 / Terminal 2\nArrival assistance, transfer arrangements and hotel check-in support are planned.\nTerminal meeting points, operating hours, limousine arrangements and airport staff contacts: to be confirmed.\nIf your flight changes, notify KITA.","status":"PENDING","updated_at":"2026-10-28"},{"section":"hotel","title":"ibis Styles Ambassador Seoul Gangnam","body":"Check-in: November 23 | Check-out: November 26\n3 nights | Breakfast for one guest\nCheck-in/out times, breakfast venue, reservation procedure and incidental charges: to be confirmed.","status":"PLANNED","updated_at":"2026-10-28"},{"section":"shuttle","title":"Hotel ↔ COEX shuttle","body":"Service is under discussion for November 24–25. Departure times, frequency and boarding points will be announced once confirmed.","status":"PENDING","updated_at":"2026-10-28"},{"section":"venue","title":"COEX · Seoul","body":"Exact hall, floor and entrance: to be confirmed.\nBuyer registration location, booth map, support desk, meal arrangements and Wi-Fi details will be added.","status":"PENDING","updated_at":"2026-10-28"},{"section":"notices","title":"Draft guide · for review","body":"This is a working draft. Meeting times, transport arrangements and venue details are subject to confirmation. Refresh the page to load the latest published sheet data.","status":"PENDING","updated_at":"2026-10-28"},{"section":"contacts","title":"KITA organizing team","body":"Justin Son | Assistant Manager, Global Matching Center\nKorea International Trade Association\nOffice: +82-2-6000-4440\nEmail: justin0830@kita.net\nOn-site mobile and service hours: to be confirmed.","status":"PLANNED","updated_at":"2026-10-28"}],"schedule":[{"date":"2026-11-23","title":"Arrival & hotel check-in","detail":"Incheon Airport → designated hotel. Transfer details pending.","status":"PLANNED"},{"date":"2026-11-24","title":"Business meetings · Day 1","detail":"COEX | 10:00–18:00 and 9 sessions planned; final timetable pending.","status":"PENDING"},{"date":"2026-11-25","title":"Business meetings · Day 2","detail":"COEX | 10:00–18:00 and 9 sessions planned; final timetable pending.","status":"PENDING"},{"date":"2026-11-26","title":"Check-out & departure","detail":"Airport transfer support and arrangements pending.","status":"PENDING"}],"fetchedAt":"2026-10-28 (preview)"};
const DEMO_MEETINGS=[{"date":"2026-11-24","time":"10:00–10:40","supplier":"Sample Supplier A (fictional)","products":"Sample skincare products","booth":"Sample B-01","status":"SAMPLE"},{"date":"2026-11-24","time":"10:50–11:30","supplier":"Sample Supplier B (fictional)","products":"Sample household products","booth":"Sample B-01","status":"SAMPLE"},{"date":"2026-11-25","time":"10:00–10:40","supplier":"Sample Supplier C (fictional)","products":"Sample food products","booth":"Sample B-01","status":"SAMPLE"}];
if(window.google?.script?.run){google.script.run.withSuccessHandler(loaded).withFailureHandler(()=>{el('notice').replaceChildren(node('p','Guide could not be loaded. Please refresh or contact KITA.','error'))}).getGuide()}else{el('mode').textContent='OFFLINE PREVIEW · SAMPLE DATA';loaded(DEMO_DATA)}
</script></body></html>
